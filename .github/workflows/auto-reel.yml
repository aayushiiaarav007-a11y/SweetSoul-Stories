name: SweetSoul Auto Reel

# ---------------------------------------------------------------------------
# Generates ONE heartwarming Short per scheduled run and uploads it to YouTube,
# producing THREE separate posts per day at staggered USA-friendly times.
#
# Cron is in UTC. The USA Eastern Time mapping below assumes:
#   EST = UTC-5 (winter)  |  EDT = UTC-4 (summer)
# So the local ET clock time shifts by an hour between standard/daylight time.
# ---------------------------------------------------------------------------

on:
  schedule:
    # 12:00 UTC -> ~07:00 ET (EST) / ~08:00 ET (EDT)  [morning post]
    - cron: "0 12 * * *"
    # 17:00 UTC -> ~12:00 ET (EST) / ~13:00 ET (EDT)  [midday post]
    - cron: "0 17 * * *"
    # 22:00 UTC -> ~17:00 ET (EST) / ~18:00 ET (EDT)  [evening post]
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Number of days to generate for"
        required: false
        default: "1"
      per_day:
        description: "Reels per day"
        required: false
        default: "1"
      upload_youtube:
        description: "Upload generated reels to YouTube"
        required: false
        default: "true"
      upload_instagram:
        description: "Upload generated reels to Instagram (risky, off by default)"
        required: false
        default: "false"

# Avoid overlapping runs stepping on each other.
concurrency:
  group: sweetsoul-auto-reel
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies (ffmpeg + imagemagick)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick fonts-dejavu-core
          # ImageMagick's default policy blocks some operations MoviePy needs.
          # Relax the text/path policy so TextClip (captions + hook) works.
          POLICY="/etc/ImageMagick-6/policy.xml"
          if [ -f "$POLICY" ]; then
            sudo sed -i 's/rights="none" pattern="@\*"/rights="read|write" pattern="@*"/' "$POLICY" || true
            sudo sed -i 's/<policy domain="path" rights="none" pattern="@\*"\/>//' "$POLICY" || true
          fi

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Determine run parameters
        id: params
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "days=1" >> "$GITHUB_OUTPUT"
            echo "per_day=1" >> "$GITHUB_OUTPUT"
          else
            echo "days=${{ github.event.inputs.days }}" >> "$GITHUB_OUTPUT"
            echo "per_day=${{ github.event.inputs.per_day }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate reel(s)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python generate.py --days "${{ steps.params.outputs.days }}" --per-day "${{ steps.params.outputs.per_day }}"

      - name: Upload to YouTube
        if: ${{ github.event_name == 'schedule' || github.event.inputs.upload_youtube == 'true' }}
        env:
          YT_CLIENT_SECRET_JSON: ${{ secrets.YT_CLIENT_SECRET_JSON }}
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
        run: |
          python upload_youtube.py --limit "${{ steps.params.outputs.per_day }}" --privacy public

      - name: Upload to Instagram (optional)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.upload_instagram == 'true' }}
        env:
          IG_USERNAME: ${{ secrets.IG_USERNAME }}
          IG_PASSWORD: ${{ secrets.IG_PASSWORD }}
        run: |
          python upload_instagram.py --limit "${{ steps.params.outputs.per_day }}"

      - name: Upload generated reels as artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: sweetsoul-reels
          path: |
            output/*.mp4
            manifest.json
          if-no-files-found: ignore
          retention-days: 7
