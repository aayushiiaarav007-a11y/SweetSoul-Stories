name: MoralTales Auto Longform

# ONE long-form (5-7 min) moral story, posted roughly EVERY OTHER DAY at US
# prime time. Running on alternate days keeps total GitHub Actions usage well
# under the 2000 min/month free limit for this PRIVATE repo (reels keep running
# daily, untouched).
#
#   cron "30 22 */2 * *" = 22:30 UTC on every 2nd day-of-month (~15 runs/month)
#     = 6:30 PM US Eastern (EDT) / 3:30 PM US Pacific  -> US evening prime
#     = 4:00 AM IST
#
# This workflow lives entirely under the longform/ folder and does NOT touch the
# SweetSoul reel pipeline or its schedule.

on:
  schedule:
    - cron: "30 22 */2 * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "test = fast ~1-min build (no upload) | preview = real 5-7 min build (no upload) | full = real build + upload"
        required: false
        default: "preview"
      upload_youtube:
        description: "Upload to YouTube (only applies in full mode)"
        required: false
        default: "true"

concurrency:
  group: moraltales-auto-longform
  cancel-in-progress: false

defaults:
  run:
    working-directory: longform

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python (with pip cache)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: longform/requirements.txt

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: longform-apt-${{ runner.os }}-v1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick fonts-dejavu-core
          POLICY="/etc/ImageMagick-6/policy.xml"
          if [ -f "$POLICY" ]; then
            sudo sed -i 's/rights="none" pattern="@\*"/rights="read|write" pattern="@*"/' "$POLICY" || true
            sudo sed -i 's/<policy domain="path" rights="none" pattern="@\*"\/>//' "$POLICY" || true
          fi

      - name: Download royalty-free music tracks (soft, calm)
        run: |
          mkdir -p assets/music
          dl() {
            curl -fsSL --max-time 30 -o "assets/music/$1" "$2" 2>/dev/null || { rm -f "assets/music/$1"; echo "SKIP $1"; return 1; }
            [ "$(stat -c%s "assets/music/$1" 2>/dev/null || echo 0)" -gt 10000 ] && echo "OK $1" || { rm -f "assets/music/$1"; echo "SKIP $1"; }
          }
          dl "01_calm_piano.mp3"     "https://cdn.pixabay.com/download/audio/2021/08/08/audio_dc39bde6cf.mp3" || true
          dl "02_gentle_ambient.mp3" "https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3" || true
          dl "03_soft_strings.mp3"   "https://cdn.pixabay.com/download/audio/2022/10/30/audio_c8f4bb65b0.mp3" || true
          ls -la assets/music/ || true

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate (TEST = fast 1-min build, no upload)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'test' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TTS_VOICE: ${{ secrets.TTS_VOICE }}
        run: |
          python generate.py --test
          echo "TEST build complete. Download the artifact below to review the look."

      - name: Generate (FULL real 5-7 min story — schedule, preview or full)
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.mode == 'full' || github.event.inputs.mode == 'preview')) }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TTS_VOICE: ${{ secrets.TTS_VOICE }}
        run: |
          python generate.py --count 1
          echo "Build complete. If this was 'preview', download the artifact below to watch the REAL video before it ever goes to YouTube."

      - name: Upload to YouTube (FULL mode / scheduled only — NOT preview/test)
        if: ${{ (github.event_name == 'schedule') || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'full' && github.event.inputs.upload_youtube != 'false') }}
        env:
          YT_CLIENT_SECRET_JSON: ${{ secrets.YT_CLIENT_SECRET_JSON }}
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
        run: |
          python upload_youtube.py

      - name: Upload video artifact (for your review)
        uses: actions/upload-artifact@v4
        with:
          name: moraltales-output
          path: |
            longform/output/*.mp4
            longform/output/*.jpg
          retention-days: 7
          if-no-files-found: ignore
